name: Compilar Jongers Print Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compilar-apk.yml'
      - 'JongersPrintAndroid/**'

permissions:
  contents: read

jobs:
  generar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar SDK Android disponible
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Instalar plataforma Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Compilar APK de pruebas
        run: gradle --no-daemon --stacktrace -p JongersPrintAndroid :app:assembleDebug

      - name: Verificar firma, integridad y compatibilidad del APK
        run: |
          APK=JongersPrintAndroid/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)'

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Jongers-Print-Android-APK
          path: JongersPrintAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
